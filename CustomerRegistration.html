<!DOCTYPE html>
<html lang="en">

<head>

    <title>Customer Registration</title>

    <link rel="stylesheet" href="CustomerRegistration.css">
    <link rel="icon" href="favicon.png">
</head>

<body>

    <h1>Customer Registration</h1>

    <p id="para2">
        Welcome! Register to start shopping with us.
    </p>

    <h2 class="class1">Customer Registration Form</h2>

    <p id="para3">
        Please fill in all required fields.
    </p>

    <form action="" method="post" class="registrationform">

        <table>

            <tr>
                <td>
                    <label for="name">Full Name</label>
                </td>

                <td>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="phone">Phone Number</label>
                </td>

                <td>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="confirmpassword">Confirm Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="confirmpassword"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        required>
                </td>
            </tr>

            <tr>
                <td>Gender</td>

                <td>
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                        required>
                    <label for="male">Male</label>

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female">
                    <label for="female">Female</label>

                    <input
                        type="radio"
                        id="other"
                        name="gender"
                        value="other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="address">Address</label>
                </td>

                <td>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        cols="30"
                        placeholder="Enter your address"
                        required></textarea>
                </td>
            </tr>

            <tr>
                <td>Terms</td>

                <td>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted"
                        required>

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </td>
            </tr>

            <tr>
                <td></td>

                <td>
                    <button type="submit">Register</button>

                    <button type="reset" class="resetbutton">
                        Reset
                    </button>
                </td>
            </tr>

        </table>

    </form>

    <p class="loginlink">
        Already have an account?
        <a href="CustomerLogin.html">Login here</a>
    </p>

</body>

</html>
