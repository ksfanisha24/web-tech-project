<!DOCTYPE html>
<html lang="en">

<head>

    <title>Admin Login</title>

    <link rel="stylesheet" href="AdminLogin.css">
    <link rel="icon" href="favicon.png">

</head>

<body>

    <h1>Admin Login</h1>

    <p id="para2">
        Welcome back! Please log in to your admin account.
    </p>

    <h2 class="class1">Admin Login Form</h2>

    <p id="para3">
        Enter your email and password to continue.
    </p>

    <form action="" method="get" class="loginform">

        <table>

            <tr>
                <td>
                    <label for="email">Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </td>
            </tr>

<tr>
    <td></td>

    <td>
         <a href="AdminDashboard.html" target="_blank">
            <button type="button">Login</button>
        </a>
    </td>
</tr>

</table>

    </form>

    <p class="registerlink">
        Don't have an account?
        <a href="index.html" target="_blank">Register here</a>
    </p>

</body>

</html>
