<!DOCTYPE html>
<html>
<head>
    <title>Staff Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <div class="header">
        <h1>Clothing Brand Management System</h1>
        <h2>My Profile</h2>
        <p>Staff ID: 24-59974-3</p>
    </div>

    <div class="navbar">
        <a href="staff.html">Dashboard</a>
        <a href="orders.html">Orders</a>
        <a href="notes.html">Processing Notes</a>
        <a href="delivery.html">Delivery</a>
        <a href="completed.html">Completed Orders</a>
        <a href="profile.html">My Profile</a>
    </div>

    <div class="content">

        <div class="card">
            <h2>Staff Information</h2>
            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" value="A. K. M Habibul Islam Rafin" required>

                <label for="id">Staff ID:</label>
                <input type="text" id="id" name="id" value="24-59974-3" readonly>

                <label for="role">Role:</label>
                <input type="text" id="role" name="role" value="Staff" readonly>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>

                <div class="form-buttons">
                    <input type="submit" value="Update Profile">
                    <input type="reset" value="Reset">
                </div>
            </form>
        </div>

    </div>

    <div class="footer">
        <p>Clothing Brand Management System</p>
        <p>Staff Module | 24-59974-3</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
