<!DOCTYPE html>
<html lang="en">

<head>

    <title>Admin Registration</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">

</head>

<body>

    <h1>Admin Registration</h1>

    <p id="para2">
        Please complete the form to register as an admin.
    </p>

    <h2 class="class1">Admin Registration Form</h2>

    <p id="para3">
        Please fill in all required fields.
    </p>

    <form action="" method="get" class="registration-form">

        <table>

            <tr>
                <td>
                    <label for="name">Name</label>
                </td>

                <td>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="age">Age</label>
                </td>

                <td>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="dob">DOB</label>
                </td>

                <td>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required>
                </td>
            </tr>

          
            <tr>
                <td>Gender</td>

                <td>
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                        required>
                    <label for="male">Male</label>

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female"
                        required>
                    <label for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="membership">Membership Type</label>
                </td>

                <td>
                    <select
                        id="membership"
                        name="membership"
                        required>

                        <option value="">Select Type</option>
                        <option value="regular">Regular</option>
                        <option value="premium">Premium</option>
                        <option value="student">Student</option>

                    </select>
                </td>
            </tr>


            <tr>
                <td>
                    <label for="file">Profile Picture</label>
                </td>

                <td>
                    <input
                        type="file"
                        id="file"
                        name="file"
                        accept="image/*"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="address">Address</label>
                </td>

                <td>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        cols="30"
                        placeholder="Enter your address"
                        required></textarea>
                </td>
            </tr>

            <tr>
                <td>Terms</td>

                <td>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted"
                        required>

                    <label for="terms">
                        I agree to the terms
                    </label>
                </td>
            </tr>

            <tr>
                <td></td>

                <td>
                    <button type="submit">Register</button>
                </td>
            </tr>

        </table>

    </form>

    <p class="loginlink">
        Already have an account?
        <a href="AdminLogin.html" target="_blank">Login here</a>
    </p>

</body>

</html>
