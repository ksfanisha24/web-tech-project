<!DOCTYPE html>
<html lang="en">

<head>

    <title>Admin Login</title>

<link rel="stylesheet" href="../css/AdminLogin.css">
<link rel="icon" href="../images/favicon.png">
<script src="../js/AdminLogin.js" defer></script>

</head>

<body>

    <h1>Matcha Berry Boutique</h1>

    <p id="para2">
        Welcome back! Please log in to your admin account.
    </p>

    <h2 class="class1">Admin Login Form</h2>

    <p id="para3">
        Enter your email and password to continue.
    </p>

    <form action="AdminDashboard.html" method="get" class="loginform" onsubmit="return validateLogin()">

        <table>

            <tr>
                <td>
                    <label for="email">Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </td>
            </tr>

<tr>
    <td></td>

    <td>
        
            <button type="submit">Login</button>
       
    </td>
</tr>

</table>

    </form>

    <p class="registerlink">
        Don't have an account?
        <a href="index.html" target="_blank">Register here</a>
    </p>

</body>

</html>
