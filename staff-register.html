<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - Clothing Brand Management System</title>
    <link rel="stylesheet" href="css/staff-register.css">
</head>
<body>
    <div class="header">
        <h1>Clothing Brand Management System</h1>
        <h2>Staff Registration</h2>
    </div>
    <div class="page-wrapper">
        <div class="register-card">
            <div class="card-header">
                <h2>Create Staff Account</h2>
                <p>Fill in the details below to register as a staff member.</p>
            </div>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                    <span class="error-msg" id="fullNameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 8 characters">
                        <span class="error-msg" id="passwordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password">
                        <span class="error-msg" id="confirmPasswordError"></span>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
                        <span class="error-msg" id="phoneError"></span>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                        <span class="error-msg" id="dobError"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter your full address"></textarea>
                    <span class="error-msg" id="addressError"></span>
                </div>
                <div id="formSuccessMsg" class="success-msg"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Register Account</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
                <p class="login-link">Already have an account? <a href="staff-login.html">Sign In Here</a></p>
            </form>
        </div>
    </div>
    <div class="footer">
        <p>Clothing Brand Management System</p>
        <p>Web Technologies | Staff Module</p>
    </div>
</body>
</html>
