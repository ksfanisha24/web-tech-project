<!DOCTYPE html>
<html>
<head>
    <title>Manager Login</title>
    <link rel="stylesheet" href="../css/Login.css">
    <link rel="icon" href="../images/favicon.png">
    <script src="../js/Login.js" defer></script>
</head>

<body>
    <h1>Manager Login</h1>
    <p id="para2">
        Welcome back! Please log in to your account.
    </p>

    <h2 class="class1">Manager Login Form</h2>
    <p id="para3">
        Enter your email and password to continue.
    </p>

    <form action="ManagerDashboard.html" method="post" class="login-form" onsubmit="return validateManagerLogin();" novalidate>
        <table>
            <tr>
                <td><label for="email">Email</label></td>
 
                <td>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </td>
            </tr>

            <tr>
                <td><label for="password">Password</label></td>

                <td>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </td>
            </tr>

<tr>
    <td></td>

    <td>
         <button type="submit">Login</button>
    </td>
</tr>

</table>
</form>
    <p class="register link"> Don't have an account? <a href="ManagerRegistration.html" target="_blank">Register here</a></p>    
</body>
</html>
