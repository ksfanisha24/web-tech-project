<!DOCTYPE html>
<html lang="en">

<head>

    <title>Customer Login</title>

    <link rel="stylesheet" href="CustomerLogin.css">
    <link rel="icon" href="favicon.png">
</head>

<body>

    <h1>Customer Login</h1>

    <p id="para2">
        Welcome back! Login to your customer account.
    </p>

    <h2 class="class1">Customer Login Form</h2>

    <p id="para3">
        Please enter your email and password.
    </p>


    <form action="" method="post" class="loginform">

        <table>

            <tr>
                <td>
                    <label for="email">Email</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">Password</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </td>
            </tr>

            <tr>
                <td></td>

                <td>
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        value="yes">

                    <label for="remember">Remember Me</label>
                </td>
            </tr>

            <tr>
                <td></td>

                <td>
                    <a href="CustomerHome.html">Login</a>
                </td>
            </tr>

        </table>

    </form>

    <p class="registrationlink">
        Don't have an account?
        <a href="CustomerRegistration.html">Create Account</a>
    </p>

</body>

</html>
